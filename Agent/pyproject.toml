[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cf-stitch-agent"
version = "0.1.0"
description = "Local carbon-fiber preform stitching research assistant — stage 4"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit>=1.45,<2",
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
