unit_rules:
  frequency: Hz * 60 = stitches/min, one stitch per cycle must be confirmed
  tension: N 与 cN、gf 需显式换算；不可混同张力测量对象
  geometry: 存储规范单位 mm；原始值、原始单位不丢弃
formulas:
- id: rectangular_puncture_density
  expression: 1000000/(pitch_mm*row_spacing_mm)
  output_unit: points/m^2
  source_refs:
  - document_id: D2
    file_sha256: b4e2b13767b3ca2c61fb07c751e3649b2d2043eb2ff62858bbdce62b483701c3
    section: 五、缝合密度与结构设计
    rendered_page_hint: 7
    block_id: D2:p0032
  guards:
  - p>0 and s>0
  - rectangular lattice
  - one puncture per cell
  - extra punctures and finite-edge effects excluded
- id: ideal_straight_feed
  expression: pitch_mm*stitch_frequency_spm/1000
  output_unit: m/min
  basis: 本次设计的运动学推导，不是D2直接给出的公式
  guards:
  - straight feed
  - one stitch per cycle
  - p is actual feed per stitch
  - no extra pattern/return stitches
  - ideal synchronization
system_fields_without_source_numeric_limits:
- needle_thread_compatibility
- V_angle_deg
- splice_gap_mm
- edge_distance_mm
- R_radius_mm
- TCP_calibration_error_mm
